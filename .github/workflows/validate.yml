# Every pull request and every push to main: schema, media, content policy,
# licences, REUSE, generated files up to date, and each changed model built
# with the pinned engine and held to the numbers ArgilCAD measured.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # A pull request from a fork never runs its code here: outside pull
    # requests are closed (close-external-prs.yml), and model.py is code.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: REUSE
        run: reuse lint
      - name: Check changed entries
        if: github.event_name == 'pull_request'
        run: python tools/gallery.py check --changed "origin/${{ github.base_ref }}"
      - name: Check everything
        if: github.event_name == 'push'
        run: python tools/gallery.py check
