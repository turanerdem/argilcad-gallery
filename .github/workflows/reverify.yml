# Once a month, and by hand after the engine pins change: build every model
# and report whether its numbers still hold. Writes nothing; a drift is for a
# person to read in the job summary.
name: reverify

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python tools/gallery.py reverify | tee -a "$GITHUB_STEP_SUMMARY"
